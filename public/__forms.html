<!DOCTYPE html>
<html>
  <head></head>
  <body>
    <!-- Netlify form detection — mirrors BookingForm.tsx fields -->

    <!-- Compact quote form (hero + regional/service pages) -->
    <form name="quote-compact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="quote-compact" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <input type="text" name="vehicleType" />
      <input type="text" name="service" />
      <input type="text" name="date" />
      <input type="text" name="timeSlot" />
      <input type="text" name="location" />
      <textarea name="message"></textarea>
    </form>

    <!-- Full quote form (contact page) -->
    <form name="quote-full" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="quote-full" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <input type="text" name="vehicleType" />
      <input type="text" name="service" />
      <input type="text" name="date" />
      <input type="text" name="timeSlot" />
      <input type="text" name="location" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
